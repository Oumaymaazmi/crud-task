spring:
  application:
    name: task

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: tas-demo
    password: task
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  flyway:
    out-of-order: true
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    org.flywaydb: DEBUG